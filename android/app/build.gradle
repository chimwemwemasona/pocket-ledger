plugins { id 'com.android.application' }
android {
 namespace 'com.masona.pocketledger'
 compileSdk 35
 defaultConfig { applicationId 'com.masona.pocketledger'; minSdk 26; targetSdk 35; versionCode 2; versionName '0.2.0' }
 signingConfigs { release { if (System.getenv('LEDGER_KEYSTORE')) { storeFile file(System.getenv('LEDGER_KEYSTORE')); storePassword System.getenv('LEDGER_STORE_PASSWORD'); keyAlias 'pocket-ledger'; keyPassword System.getenv('LEDGER_KEY_PASSWORD') } } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
